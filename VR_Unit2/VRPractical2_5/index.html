<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="wall.js"></script>
    <script src="dude.js"></script>
    <script src="script.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <!-- Challenge
             Upload a picture to use as the texture for the walls of your maze if you want
        -->
      <img id="wall" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShyAOaxwUE3lI3vkpR9QuQSmVVa06rm1Yl6v8yknuiXg&s=10">
      </a-assets>
      <a-plane position="0 0 0" rotation="-90 0 0" width="150" height="150" color="#AAFFAA"></a-plane>
      
      <a-entity id="dudeTemplate" position="-2 -1000 -100">
        <a-sphere position="0 0 0" radius=".5" color="#FF007F"></a-sphere>
        <a-cylinder position="0 0.35 0" radius=".2" height="0.5" color="gray"></a-cylinder>
        <a-cylinder position="0 0.6 0" radius=".1" height="0.5"></a-cylinder>
        
        <a-cylinder position="-0.3 -0.6 0.07" rotation="90 0 0" radius=".1" height=".26" color="Goldenrod"></a-cylinder>
        <a-cylinder position="-0.3 -0.5 0" radius=".05" height=".3" color="Goldenrod"></a-cylinder>
        <a-sphere position="-0.3 -0.6 0.22" radius=".105" color="Goldenrod"></a-sphere>
        <a-cylinder position="0.3 -0.6 0.07" rotation="90 0 0" radius=".1" height=".26" color="Goldenrod"></a-cylinder>
        <a-cylinder position="0.3 -0.5 0" radius=".05" height=".3" color="Goldenrod"></a-cylinder>
        <a-sphere position="0.3 -0.6 0.22" radius=".105" color="Goldenrod"></a-sphere>
        
        <a-cylinder position="-.18 0 0.45" radius=".10" height=".25" color="white"></a-cylinder>
        <a-cylinder position=".18 0 0.45" radius=".10" height=".25" color="white"></a-cylinder>
      </a-entity>
      
      <a-sky color="#0099EE"></a-sky>
      <a-camera position="0 1.7 0"> 
      </a-camera>
</html>
