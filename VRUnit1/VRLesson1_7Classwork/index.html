<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-entity rotation="90 180 0" position="0 -1 0">
        <a-sphere radius="1" position="0 1 -2" color="yellow" theta-start="0" theta-length="90" side="double" rotation="-45 0 0"></a-sphere>
        <a-sphere radius="1" position="0 1 -2" color="yellow" theta-start="0" theta-length="90" side="double" rotation="45 0 0"></a-sphere>
        <a-sphere radius="0.25" color="black" position="0.7 0.8 -2.8"></a-sphere>
        <a-sphere radius="0.25" color="black" position="-0.7 0.8 -2.8"></a-sphere>
      </a-entity>
      <a-entity position="-4 0 -6">
        <a-sphere position="0 2 0" theta-start="0" theta-length="90" color="pink"></a-sphere>
        <a-cylinder color="pink" position="0 1.38 0" radius="1" height="1.25"></a-cylinder>
        <a-cone radius-bottom="0.4" height="0.5" position="0 0.5 0.5" color="pink" rotation="180 0 0"></a-cone>
        <a-cone radius-bottom="0.4" height="0.5" position="-0.5 0.5 0" color="pink" rotation="180 0 0"></a-cone>
        <a-cone radius-bottom="0.4" height="0.5" position="0.5 0.5 0" color="pink" rotation="180 0 0"></a-cone>
        <a-cone radius-bottom="0.4" height="0.5" position="0 0.5 -0.5" color="pink" rotation="180 0 0"></a-cone>
        <a-sphere radius="0.25" position="0.5 2 1"></a-sphere>
        <a-sphere radius="0.1" color="blue" position="0.5 2 1.25"></a-sphere>
        <a-sphere radius="0.25" position="-0.5 2 1"></a-sphere>
        <a-sphere radius="0.1" color="blue" position="-0.5 2 1.25"></a-sphere>
      </a-entity>




      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
      <a-camera position="0 1 2"></a-camera>
    </a-scene>
  </body>
</html>
